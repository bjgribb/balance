[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "DB_CONN=\"${ConnectionStrings__DefaultConnection:-$DATABASE_URL}\" && if [ -z \"$DB_CONN\" ]; then echo 'Missing ConnectionStrings__DefaultConnection or DATABASE_URL'; exit 1; fi && ./out/efbundle --connection \"$DB_CONN\""
startCommand = "dotnet out/api.dll"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

