[build]
cmd = [
  "dotnet tool install --global dotnet-ef",
  "export PATH=\"$PATH:/root/.dotnet/tools\" && dotnet ef migrations bundle --self-contained -r linux-x64 --project api.csproj --output out/efbundle",
  "dotnet publish -c Release -o out"
]

[start]
cmd = "DB_CONN=\"${ConnectionStrings__DefaultConnection:-$DATABASE_URL}\" && chmod +x out/efbundle && ./out/efbundle --connection \"$DB_CONN\" && dotnet out/api.dll"

